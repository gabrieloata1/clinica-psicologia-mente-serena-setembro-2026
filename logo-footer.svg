<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 70" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="ms-sage-grad-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5d8a69"/>
      <stop offset="50%" stop-color="#7da887"/>
      <stop offset="100%" stop-color="#a8c6ae"/>
    </linearGradient>
    <linearGradient id="ms-leaf-grad-dark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7da887"/>
      <stop offset="100%" stop-color="#cddfd1"/>
    </linearGradient>
    <linearGradient id="ms-gold-grad-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfba73"/>
      <stop offset="50%" stop-color="#f3dca6"/>
      <stop offset="100%" stop-color="#c9a25e"/>
    </linearGradient>
    <filter id="ms-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#7da887" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Símbolo Emblemático -->
  <g transform="translate(6, 6)" filter="url(#ms-glow)">
    <!-- Círculo Base Translúcido -->
    <circle cx="29" cy="29" r="28" fill="#283b2f" stroke="#476e52" stroke-width="1.5"/>
    <circle cx="29" cy="29" r="25" fill="none" stroke="url(#ms-gold-grad-dark)" stroke-width="0.8" stroke-dasharray="2 2.5" opacity="0.7"/>

    <!-- Folha / Mente em Crescimento - Lado Esquerdo -->
    <path d="M29 44 C22 44 14 38 14 28 C14 20 21 14 24 12 C24 17 25 24 29 27 C28 33 28.5 39 29 44 Z" fill="url(#ms-sage-grad-dark)"/>

    <!-- Folha / Harmonia - Lado Direito -->
    <path d="M29 44 C36 44 44 38 44 28 C44 20 37 14 34 12 C34 17 33 24 29 27 C30 33 29.5 39 29 44 Z" fill="url(#ms-leaf-grad-dark)"/>

    <!-- Flor de Lótus / Chama Central da Consciência -->
    <path d="M29 11 C29 11 34 19 34 25 C34 29.5 31.8 32 29 33 C26.2 32 24 29.5 24 25 C24 19 29 11 29 11 Z" fill="url(#ms-gold-grad-dark)"/>

    <!-- Base Acolhedora -->
    <path d="M19 36 C22 42 26 44.5 29 44.5 C32 44.5 36 42 39 36 C37 41 33 46 29 46 C25 46 21 41 19 36 Z" fill="#7da887"/>

    <!-- Ponto Zen -->
    <circle cx="29" cy="18" r="2.2" fill="#ffffff"/>
    <circle cx="29" cy="18" r="1.2" fill="url(#ms-gold-grad-dark)"/>
  </g>

  <!-- Tipografia da Marca (Versão Fundo Escuro) -->
  <g transform="translate(74, 11)">
    <!-- Nome Principal em Branco / Sage Suave -->
    <text x="0" y="32" font-family="'Fraunces', 'Playfair Display', Georgia, serif" font-size="28" font-weight="700" fill="#ffffff" letter-spacing="-0.3">
      Mente <tspan font-style="italic" font-weight="500" fill="#a8c6ae">Serena</tspan>
    </text>

    <!-- Linha divisória dourada suave -->
    <line x1="1" y1="39" x2="225" y2="39" stroke="url(#ms-gold-grad-dark)" stroke-width="1" opacity="0.6"/>

    <!-- Tagline -->
    <text x="2" y="49" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="8" font-weight="700" fill="#cddfd1" letter-spacing="2.8">
      CLÍNICA DE PSICOLOGIA &amp; BEM-ESTAR
    </text>
  </g>
</svg>
